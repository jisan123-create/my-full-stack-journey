    <main>
      <!-- page title -->
      <section class="page-title">

            <div class="col-lg-12 col-md-12 col-sm-12">
              <h2>Contact Us</h2>
            </div>
          </div>
        </div>
      </section>
      <!-- end page title -->

      <!-- direct contact information -->
      <section class="direct-contact-info">
        <div class="container">
          <div class="section-title">
            <h3>Direct Contact Information</h3>
          </div>
          <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-12">
              <div class="information-card">
                <img src="img=part3/icons8-phone-48.png" alt="number" />
                <h4>Phone number</h4>
                <p>+8801326848453</p>
              </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
              <div class="information-card">
                <img src="img=part3/icons8-open-email-48.png" alt="number" />
                <h4>Email Address</h4>
                <p>ewrjisan31@gmail.com</p>
              </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
              <div class="information-card">
                <img src="img=part3/icons8-map-32.png" alt="number" />
                <h4>office Address</h4>
                <p>Dhaka,bangladesh</p>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- end direct contact information -->

      <!-- contact form -->
      <section class="contact-form">
        <div class="container">
          <div class="section-title">
            <h3>contact form</h3>
          </div>

          <div class="row">
            <div class="col-md-12">
              <div class="contact-btn">
                <form>
                  <div class="row">
                    <!-- Left Side -->
                    <div class="col-lg-6 col-md-6 col-sm-12">
                      <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input
                          type="text"
                          class="form-control"
                          id="name"
                          placeholder="Your name"
                        />
                      </div>

                      <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input
                          type="tel"
                          class="form-control"
                          id="phone"
                          placeholder="Your number"
                        />
                      </div>
                    </div>

                    <!-- Right Side -->
                    <div class="col-lg-6 col-md-6 col-sm-12">
                      <div class="mb-3">
                        <label for="email" class="form-label"
                          >Email address</label
                        >
                        <input
                          type="email"
                          class="form-control"
                          id="email"
                          placeholder="Your email address"
                        />
                      </div>

                      <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <input
                          type="text"
                          class="form-control"
                          id="subject"
                          placeholder="Enter subject"
                        />
                      </div>
                    </div>
                  </div>

                      <div class="mb-3">
                        <label for="subject" class="form-label">Message</label>
                       <textarea placeholder="message" class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                      </div>
                  <button type="submit" class="btn btn-primary">Submit</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- end contact form -->

          <div class="row">

                referrerpolicy="strict-origin-when-cross-origin"

        </div>
